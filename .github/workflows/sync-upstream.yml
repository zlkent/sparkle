name: Sync Upstream Sparkle

on:
  schedule:
    # Avoid the top of the hour, when scheduled GitHub workflows are more likely to be delayed.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Adapt and validate without pushing or building'
        required: false
        default: true
        type: boolean
      publish:
        description: 'Push a verified adaptation and trigger the prerelease build'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    # Scheduled runs publish only after the repository variable is deliberately enabled.
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch and compare upstream
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/xishang0128/sparkle.git 2>/dev/null || true
          git fetch --no-tags upstream master

          upstream_sha="$(git rev-parse upstream/master)"
          echo "sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${upstream_sha:0:12}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "Upstream ${upstream_sha:0:12} is already included."
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "Upstream ${upstream_sha:0:12} needs adaptation."
          fi

      - name: Start upstream merge
        id: merge
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set +e
          git merge --no-ff --no-commit upstream/master \
            -m "同步：适配上游 Sparkle ${{ steps.upstream.outputs.short_sha }}"
          status=$?
          git diff --name-only --diff-filter=U > merge-conflicts.txt
          if [ "$status" -eq 0 ]; then
            echo 'result=clean' >> "$GITHUB_OUTPUT"
          else
            echo 'result=conflict' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Adapt fork customizations with Codex
        if: steps.upstream.outputs.changed == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ vars.OPENAI_RESPONSES_ENDPOINT }}
          model: ${{ vars.CODEX_MODEL }}
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-bots: true
          prompt: |
            You maintain the zlkent/sparkle fork. The repository has a no-commit merge of
            upstream/master into the fork. Adapt the fork to the latest upstream architecture.

            Preserve and make functional the fork-specific browser extension API:
            - src/main/resolve/extensionApi.ts and its lifecycle, IPC, config fields, and tests.
            - The independent "Sparkle Proxy Status" settings card, including plaintext token
              display, token reset/copy, port, and Origin allowlist controls.
            - All application updater and release URLs must use zlkent/sparkle, not the upstream fork.

            Resolve every merge conflict, including modify/delete conflicts. Do not use a blanket
            ours/theirs strategy: update the custom code to the current upstream APIs and preserve
            compatible upstream behavior. Do not remove the extension API or its regression scripts.
            Do not edit .github/workflows/sync-upstream.yml. Do not commit. Stage every resolved file
            with git add so the merge can be committed later.

      - name: Require a fully resolved merge
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Codex left unresolved merge entries:' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Detect required pnpm version
        id: pnpm
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').packageManager?.replace(/^pnpm@/, '') || 'latest'")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.upstream.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - name: Install merged dependencies
        if: steps.upstream.outputs.changed == 'true'
        run: CI=true pnpm install --frozen-lockfile

      - name: Capture initial validation failures
        id: initial-validation
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set +e
          {
            pnpm typecheck &&
              node scripts/check-ext-api-bearer-parse.mjs &&
              node scripts/check-ext-api-origin-fallback.mjs &&
              node scripts/check-ext-api-token-visibility.mjs
          } 2>&1 | tee validation.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo 'result=passed' >> "$GITHUB_OUTPUT"
          else
            echo 'result=failed' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Fix validation failures with Codex
        if: steps.initial-validation.outputs.result == 'failed'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ vars.OPENAI_RESPONSES_ENDPOINT }}
          model: ${{ vars.CODEX_MODEL }}
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-bots: true
          prompt: |
            The upstream adaptation is complete but validation failed. Read validation.log, then fix
            only the reported failures while preserving the latest upstream behavior and all fork
            browser extension API functionality. Do not weaken, delete, or bypass checks. Do not edit
            .github/workflows/sync-upstream.yml. Do not commit. Stage changed source files with git add.

      - name: Verify adapted source
        if: steps.upstream.outputs.changed == 'true'
        run: |
          pnpm typecheck
          node scripts/check-ext-api-bearer-parse.mjs
          node scripts/check-ext-api-origin-fallback.mjs
          node scripts/check-ext-api-token-visibility.mjs
          git diff --check

      - name: Commit and push verified adaptation
        id: push
        if: steps.upstream.outputs.changed == 'true' && inputs.dry_run != true && (inputs.publish == true || vars.AUTO_PUBLISH == 'true')
        shell: bash
        run: |
          git add -A
          git commit -m "同步：适配上游 Sparkle ${{ steps.upstream.outputs.short_sha }}"
          git push origin HEAD:master
          echo 'result=pushed' >> "$GITHUB_OUTPUT"

      - name: Trigger verified build and prerelease
        if: steps.push.outputs.result == 'pushed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref master

      - name: Upload adaptation diagnostics
        if: always() && steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: upstream-adaptation-${{ steps.upstream.outputs.short_sha }}
          path: |
            merge-conflicts.txt
            validation.log
          if-no-files-found: warn

      - name: Summarize result
        if: always()
        run: |
          {
            echo '## Upstream adaptation'
            echo
            echo "- upstream: ${{ steps.upstream.outputs.short_sha || 'not-fetched' }}"
            echo "- changed: ${{ steps.upstream.outputs.changed || 'false' }}"
            echo "- initial merge: ${{ steps.merge.outputs.result || 'not-run' }}"
            echo "- initial validation: ${{ steps.initial-validation.outputs.result || 'not-run' }}"
            echo "- pushed: ${{ steps.push.outputs.result || 'not-pushed' }}"
          } >> "$GITHUB_STEP_SUMMARY"
